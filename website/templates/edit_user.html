{% block content %}

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

<form action="{{ url_for('edit_user', user_id=user[0]) }}" method="post">
    <label for="name">Identifiant:</label>
    <input type="text" id="name" name="name" value="{{ user[1] }}" required>
    <label for="password">Mot de passe:</label>
    <input type="password" id="password" name="password" required>
    <label for="role">Rôle:</label>
    <select id="role" name="role" required>
        <option value="client" {% if user[3] == 'client' %}selected{% endif %}>Client</option>
        <option value="admin" {% if user[3] == 'admin' %}selected{% endif %}>Admin</option>
    </select>
    <button type="submit">Modifier l'utilisateur</button>
</form>

{% endblock %}
